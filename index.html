<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;500;700&family=Satisfy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>WhiteArt/Ingresar</title>
    <style>
      .carousel-item img { height: 100vh; object-fit: cover; }
      .password-container { position: relative; }
      .password-container input { padding-right: 42px; }
      .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d; z-index: 10; }
      #toast-notificacion { position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 280px; max-width: 360px; background-color: #ffffff; border-left: 5px solid #008394; box-shadow: 0 5px 15px rgba(0,0,0,0.15); border-radius: 8px; padding: 12px 16px; display: none; opacity: 0; transition: opacity 0.3s ease-in-out; }
      #toast-notificacion.show { display: block; opacity: 1; }
      @media (max-width: 991.98px) { .carousel-item img { height: 240px; } }
      @media (max-width: 575.98px) { .carousel-section { display: none; } }
    </style>
  </head>
  <body class="bg-blue">
    <div id="toast-notificacion" class="shadow-sm">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <i class="fa fa-check-circle text-success fa-lg me-2" id="toast-icon"></i>
          <div>
            <h6 class="mb-0 fw-bold" style="color: #008394; font-size: 0.9rem;">WhiteArt</h6>
            <small class="text-dark" id="toast-mensaje" style="font-size: 0.82rem;">Notificación</small>
          </div>
        </div>
        <button type="button" class="btn-close ms-3 p-0 bg-transparent border-0" onclick="ocultarToast()" style="font-size: 1rem;">&times;</button>
      </div>
    </div>

    <section class="container-fluid p-0">
      <div class="row g-0 min-vh-100">
        <div class="col-12 col-lg-7 carousel-section">
          <div id="carouselExampleIndicators" class="carousel slide h-100" data-bs-ride="carousel">
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner h-100">
              <div class="carousel-item active h-100"><img src="4.jpg" class="d-block w-100" alt=""></div>
              <div class="carousel-item h-100"><img src="5.jpg" class="d-block w-100" alt=""></div>
              <div class="carousel-item h-100"><img src="6.jpg" class="d-block w-100" alt=""></div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-5 d-flex flex-column justify-content-between p-3 p-sm-4 p-md-5">
          <div class="w-100 text-center text-lg-start mb-2">
            <img src="WhiteArt.png" class="img-fluid" style="max-width: 120px;" alt="WhiteArt Logo">
          </div>

          <div class="w-100 my-auto py-2">
            <h1 class="text-center font-weight-bold mb-4" style="font-size: 1.35rem;">BIENVENID@</h1>
            <form id="formLogin">
              <div class="mb-3">
                <label class="form-label font-weight-bold mb-1">Correo electrónico<span class="text-danger">*</span></label>
                <input type="email" id="exampleInputEmail1" class="form-control bg-bluex border-0 py-2" placeholder="ejemplo@correo.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label font-weight-bold mb-1">Contraseña<span class="text-danger">*</span></label>
                <div class="password-container">
                  <input type="password" id="exampleInputPassword1" class="form-control bg-bluex border-0 py-2" placeholder="Tu contraseña" required>
                  <i class="fa fa-eye-slash toggle-password" onclick="togglePasswordVisibility('exampleInputPassword1', this)"></i>
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="recordarme">
                  <label class="form-check-label" for="recordarme" style="font-size: 0.9rem;">Recordarme</label>
                </div>
                <a href="#" class="text-decoration-none bg-blueg" style="font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100 bg-bluey border-0 py-2 mb-2 shadow-sm">Iniciar sesión</button>
              <div class="text-center my-2">
                <span class="text-muted" style="font-size: 0.8rem;">— o inicia sesión con —</span>
              </div>
              <div id="g_id_onload"
                   data-client_id="98442464065-vr2motu2lgjgej3c6c8tnm7oda4s9gjr.apps.googleusercontent.com"
                   data-callback="handleGoogleLogin"
                   data-auto_prompt="false">
              </div>
              <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left" style="display:flex; justify-content:center;"></div>
            </form>
          </div>

          <div class="text-center w-100 mt-2 pt-2">
            <p class="d-inline-block mb-0 text-muted" style="font-size: 0.9rem;">¿Todavía no tienes cuenta?</p>
            <a href="registro.html" class="font-weight-bold text-decoration-none bg-blueg ms-1" style="font-size: 0.9rem;">Regístrate</a>
          </div>
        </div>
      </div>
    </section>

    <script>
      function togglePasswordVisibility(fieldId, iconElement) {
        const inputField = document.getElementById(fieldId);
        if (inputField.type === "password") {
          inputField.type = "text";
          iconElement.classList.remove("fa-eye-slash");
          iconElement.classList.add("fa-eye");
        } else {
          inputField.type = "password";
          iconElement.classList.remove("fa-eye");
          iconElement.classList.add("fa-eye-slash");
        }
      }

      let toastTimer;
      function mostrarToast(mensaje, tipo = 'success') {
        const toast = document.getElementById('toast-notificacion');
        const spanMensaje = document.getElementById('toast-mensaje');
        const icon = document.getElementById('toast-icon');
        spanMensaje.innerText = mensaje;
        if (tipo === 'success') {
          icon.className = 'fa fa-check-circle text-success fa-lg me-2';
        } else {
          icon.className = 'fa fa-info-circle text-info fa-lg me-2';
        }
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { ocultarToast(); }, 3000);
      }
      function ocultarToast() {
        document.getElementById('toast-notificacion').classList.remove('show');
      }

      document.getElementById('formLogin').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('exampleInputEmail1').value.trim();
        const password = document.getElementById('exampleInputPassword1').value.trim();
        if (email === '' || password === '') {
          mostrarToast('Ingresa correo y contraseña.', 'info');
          return;
        }
        const btn = e.target.querySelector('button[type="submit"]');
        const textoOriginal = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Entrando...';
        try {
          const res = await fetch('api/auth/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
          });
          const data = await res.json();
          if (!res.ok || data.ok === false) {
            mostrarToast(data.mensaje || 'Error al iniciar sesión.', 'info');
            btn.disabled = false;
            btn.textContent = textoOriginal;
            return;
          }
          mostrarToast('¡Inicio de sesión correcto! Bienvenido a WhiteArt.', 'success');
          setTimeout(() => {
            const usuario = data.data && data.data.usuario ? data.data.usuario : {};
            const rol = (usuario.rol || '').toString().toLowerCase().trim();
            if (rol === 'administrador') {
              window.location.replace('administrador.html');
            } else if (rol === 'instructor') {
              window.location.replace('DashboardInstructor.html');
            } else {
              window.location.replace('Dashboard.html');
            }
          }, 600);
        } catch (err) {
          mostrarToast('Error de conexión con el servidor.', 'info');
          btn.disabled = false;
          btn.textContent = textoOriginal;
        }
      });

      async function handleGoogleLogin(response) {
        if (!response.credential) {
          mostrarToast('No se pudo obtener el token de Google.', 'info');
          return;
        }
        try {
          const res = await fetch('api/auth/google', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
          });
          const data = await res.json();
          if (!res.ok || data.ok === false) {
            mostrarToast(data.mensaje || 'Error al iniciar sesión con Google.', 'info');
            return;
          }
          mostrarToast('¡Inicio de sesión con Google exitoso! Bienvenido a WhiteArt.', 'success');
          setTimeout(() => {
            const usuario = data.data && data.data.usuario ? data.data.usuario : {};
            const rol = (usuario.rol || '').toString().toLowerCase().trim();
            if (rol === 'administrador') {
              window.location.replace('administrador.html');
            } else if (rol === 'instructor') {
              window.location.replace('DashboardInstructor.html');
            } else {
              window.location.replace('Dashboard.html');
            }
          }, 600);
        } catch (err) {
          mostrarToast('Error de conexión con el servidor.', 'info');
        }
      }
      window.handleGoogleLogin = handleGoogleLogin;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
