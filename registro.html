<!doctype html>
<html lang="es">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;500;700&family=Satisfy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="style.css">
    <title>WhiteArt/Registro</title>

    <style>
      .carousel-item img {
        height: 100vh;
        object-fit: cover;
      }

      /* Contenedor del campo con el ojito */
      .password-container {
        position: relative;
      }
      .password-container input {
        padding-right: 42px;
      }
      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
        z-index: 10;
        transition: color 0.2s ease;
      }
      .toggle-password:hover {
        color: #212529;
      }

      /* Notificación flotante estilo Toast (Bootstrap) */
      #toast-notificacion {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        min-width: 280px;
        max-width: 360px;
        background-color: #ffffff;
        border-left: 5px solid #008394;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        border-radius: 8px;
        padding: 12px 16px;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }
      #toast-notificacion.show {
        display: block;
        opacity: 1;
      }

      @media (max-width: 991.98px) {
        .carousel-item img {
          height: 240px;
        }
        .col-lg-5 {
          min-height: auto !important;
        }
        .px-lg-5 {
          padding-left: 1.25rem !important;
          padding-right: 1.25rem !important;
        }
      }

      @media (max-width: 575.98px) {
        .carousel-section {
          display: none;
        }
      }
    </style>
  </head>
  <body class="bg-blue">
    
    <!-- NOTIFICACIÓN FLOTANTE (TOAST) -->
    <div id="toast-notificacion" class="shadow-sm">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <i class="fa fa-check-circle text-success fa-lg me-2" id="toast-icon"></i>
          <div>
            <h6 class="mb-0 fw-bold" style="color: #008394; font-size: 0.9rem;">WhiteArt</h6>
            <small class="text-dark" id="toast-mensaje" style="font-size: 0.82rem;">Notificación</small>
          </div>
        </div>
        <button type="button" class="btn-close ms-3 p-0 bg-transparent border-0" onclick="ocultarToast()" style="font-size: 1rem;">&times;</button>
      </div>
    </div>

    <section class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            
            <!-- SECCIÓN DEL CARRUSEL -->
            <div class="col-12 col-lg-7 carousel-section">
                <div id="carouselExampleIndicators" class="carousel slide h-100" data-bs-ride="carousel">
                    <div class="carousel-indicators">
                      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>
                    <div class="carousel-inner h-100">
                      <div class="carousel-item active h-100">
                        <img src="4.jpg" class="d-block w-100" alt="Slide 1">
                      </div>
                      <div class="carousel-item h-100">
                        <img src="5.jpg" class="d-block w-100" alt="Slide 2">
                      </div>
                      <div class="carousel-item h-100">
                        <img src="6.jpg" class="d-block w-100" alt="Slide 3">
                      </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                      <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Siguiente</span>
                    </button>
                </div>
            </div>

            <!-- SECCIÓN DEL FORMULARIO DE REGISTRO -->
            <div class="col-12 col-lg-5 d-flex flex-column justify-content-between p-3 p-sm-4 p-md-5">
                
                <!-- Logo -->
                <div class="w-100 text-center text-lg-start mb-2">
                  <img src="WhiteArt.png" class="img-fluid" style="max-width: 120px; height: auto;" alt="WhiteArt Logo">
                </div>

                <!-- Formulario -->
                <div class="w-100 my-auto py-2">
                    <h1 class="text-center font-weight-bold mb-4" style="font-size: 1.35rem;">¡EMPIEZA A CREAR!</h1>
                    
                    <form id="formRegistro">
                      <div class="row g-2 mb-3">
                          <div class="col-12 col-sm-6">
                              <label class="form-label font-weight-bold mb-1">Nombre<span class="text-danger">*</span></label>
                              <input type="text" class="form-control bg-bluex border-0 py-2" placeholder="Tu nombre" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]+" required>
                          </div>
                          
                          <div class="col-12 col-sm-6">
                              <label class="form-label font-weight-bold mb-1">Apellido<span class="text-danger">*</span></label>
                              <input type="text" class="form-control bg-bluex border-0 py-2" placeholder="Tu apellido" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]+" required>
                          </div>

                          <div class="col-12 col-sm-6">
                              <label class="form-label font-weight-bold mb-1">Fecha de nacimiento<span class="text-danger">*</span></label>
                              <input type="date" id="fechaNacimiento" class="form-control bg-bluex border-0 py-2" required>
                          </div>

                          <div class="col-12 col-sm-6">
                              <label class="form-label font-weight-bold mb-1">Usuario<span class="text-danger">*</span></label>
                              <span class="text-muted d-block mb-1" style="font-size: 0.75rem;">Mínimo 3 caracteres, solo letras, números, punto o guion bajo</span>
                              <input type="text" class="form-control bg-bluex border-0 py-2" placeholder="@usuario" pattern="[a-zA-Z0-9_.]{3,20}" title="3 a 20 caracteres. Solo letras, números, punto (.) o guion bajo (_). Sin espacios ni símbolos." required>
                          </div>

                          <div class="col-12">
                              <label class="form-label font-weight-bold mb-1">Correo electrónico<span class="text-danger">*</span></label>
                              <input type="email" class="form-control bg-bluex border-0 py-2" placeholder="ejemplo@correo.com" required>
                          </div>

                          <!-- Campo de Foto de Perfil (BLOB) -->
                          <div class="col-12">
                              <label class="form-label font-weight-bold mb-1">Foto de perfil (Avatar)<span class="text-danger">*</span></label>
                              <input type="file" id="fotoPerfil" class="form-control bg-bluex border-0 py-2" accept="image/*" required>
                              <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">Máximo 5 MB.</small>
                          </div>

                          <!-- Campo Contraseña con Ojito -->
                          <div class="col-12 col-sm-6">
                              <label class="form-label font-weight-bold mb-1">Contraseña<span class="text-danger">*</span></label>
                              <div class="password-container">
                                  <input type="password" id="inputPassword" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[$@$!%*?&])([A-Za-z\d$@$!%*?&]|[^ ]){8,15}" required name="pwd" class="form-control bg-bluex border-0 py-2" placeholder="Tu contraseña">
                                  <i class="fa fa-eye-slash toggle-password" onclick="togglePasswordVisibility('inputPassword', this)"></i>
                              </div>
                          </div>

                          <!-- Campo Confirmar Contraseña con Ojito -->
                          <div class="col-12 col-sm-6">
                              <label class="form-label font-weight-bold mb-1">Confirma Contraseña<span class="text-danger">*</span></label>
                              <div class="password-container">
                                  <input type="password" id="inputPasswordConfirm" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[$@$!%*?&])([A-Za-z\d$@$!%*?&]|[^ ]){8,15}" required name="pwd_confirm" class="form-control bg-bluex border-0 py-2" placeholder="Confirma tu contraseña">
                                  <i class="fa fa-eye-slash toggle-password" onclick="togglePasswordVisibility('inputPasswordConfirm', this)"></i>
                              </div>
                          </div>
                      </div>

                      <!-- Requisitos visuales -->
                      <div class="p-2 mb-3 bg-light rounded border" style="font-size: 0.78rem;">
                        <span class="fw-bold d-block text-muted mb-1">Tu contraseña debe incluir:</span>
                        <div class="row g-1 text-secondary">
                          <div class="col-6"><i class="fa fa-check-circle-o text-muted me-1"></i> Mínimo 8 caracteres</div>
                          <div class="col-6"><i class="fa fa-check-circle-o text-muted me-1"></i> 1 letra mayúscula</div>
                          <div class="col-6"><i class="fa fa-check-circle-o text-muted me-1"></i> 1 letra minúscula</div>
                          <div class="col-6"><i class="fa fa-check-circle-o text-muted me-1"></i> 1 número</div>
                          <div class="col-12"><i class="fa fa-check-circle-o text-muted me-1"></i> 1 carácter especial (@$!%*?&)</div>
                        </div>
                      </div>

                      <button type="submit" class="btn btn-primary w-100 bg-bluey border-0 py-2 mb-2 shadow-sm">Registrar</button>

                      <!-- Separador -->
                      <div class="text-center my-2">
                        <span class="text-muted" style="font-size: 0.8rem;">— o regístrate con —</span>
                      </div>

                      <!-- Botón Google -->
                      <button type="button" id="btnGoogleRegistro" class="btn w-100 btn-light border d-flex align-items-center justify-content-center py-2 shadow-sm" style="border-radius: 6px;">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18" height="18" class="me-2">
                        <span style="font-size: 0.9rem; font-weight: 500;">Registrarse con Google</span>
                      </button>
                    </form>
                </div>

                <!-- Footer / Enlace a login -->
                <div class="text-center w-100 mt-2 pt-2">
                    <p class="d-inline-block mb-0 text-muted" style="font-size: 0.9rem;">¿Ya tienes una cuenta?</p>
                    <a href="index.html" class="font-weight-bold text-decoration-none bg-blueg ms-1" style="font-size: 0.9rem;">Inicia sesión</a>
                </div>

             </div>

        </div>
    </section>

    <!-- Script con la lógica visual y Toasts -->
    <script>
      function togglePasswordVisibility(fieldId, iconElement) {
        const inputField = document.getElementById(fieldId);
        if (inputField.type === "password") {
          inputField.type = "text";
          iconElement.classList.remove("fa-eye-slash");
          iconElement.classList.add("fa-eye");
        } else {
          inputField.type = "password";
          iconElement.classList.remove("fa-eye");
          iconElement.classList.add("fa-eye-slash");
        }
      }

      let toastTimer;
      function mostrarToast(mensaje, tipo = 'success') {
        const toast = document.getElementById('toast-notificacion');
        const spanMensaje = document.getElementById('toast-mensaje');
        const icon = document.getElementById('toast-icon');
        
        spanMensaje.innerText = mensaje;
        if (tipo === 'success') {
          icon.className = 'fa fa-check-circle text-success fa-lg me-2';
        } else {
          icon.className = 'fa fa-info-circle text-info fa-lg me-2';
        }
        
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          ocultarToast();
        }, 3000);
      }

      function ocultarToast() {
        const toast = document.getElementById('toast-notificacion');
        toast.classList.remove('show');
      }

      document.getElementById('formRegistro').addEventListener('submit', async function(e) {
        e.preventDefault();
        const p1 = document.getElementById('inputPassword').value;
        const p2 = document.getElementById('inputPasswordConfirm').value;
        const nombre = document.querySelector('input[placeholder="Tu nombre"]').value.trim();
        const apellido = document.querySelector('input[placeholder="Tu apellido"]').value.trim();
        const email = document.querySelector('input[type="email"]').value.trim();

        if (p1 !== p2) {
          mostrarToast('Las contraseñas no coinciden. Por favor verifica.', 'info');
          return;
        }

        // Validación mínima de contraseña en JS
        const regexPass = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[$@$!%*?&])[^\s]{8,15}$/;
        if (!regexPass.test(p1)) {
          mostrarToast('La contraseña debe tener de 8 a 15 caracteres, con mayúscula, minúscula, número y símbolo.', 'info');
          return;
        }

        // Validación de edad mínima (13 años)
        const fechaNac = document.getElementById('fechaNacimiento').value;
        if (!fechaNac) {
          mostrarToast('La fecha de nacimiento es obligatoria.', 'info');
          return;
        }
        const nacimiento = new Date(fechaNac);
        const hoy = new Date();
        if (nacimiento > hoy) {
          mostrarToast('La fecha de nacimiento no puede estar en el futuro.', 'info');
          return;
        }
        let edad = hoy.getFullYear() - nacimiento.getFullYear();
        const mes = hoy.getMonth() - nacimiento.getMonth();
        if (mes < 0 || (mes === 0 && hoy.getDate() < nacimiento.getDate())) {
          edad--;
        }
        if (edad < 13) {
          mostrarToast('Debes tener al menos 13 años para crear una cuenta.', 'info');
          return;
        }

        // Validación de tamaño de la foto de perfil (máx. 5 MB)
        const foto = document.getElementById('fotoPerfil').files[0];
        if (foto && foto.size > 5 * 1024 * 1024) {
          mostrarToast('La foto de perfil no debe superar los 5 MB.', 'info');
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        const textoOriginal = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Registrando...';

        try {
          const res = await fetch('api/auth/registro', {
            method: 'POST',
            credentials: 'include',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              nombre: nombre,
              apellido: apellido,
              email: email,
              password: p1,
              password_confirmacion: p2
            })
          });

          const data = await res.json();

          if (!res.ok || data.ok === false) {
            mostrarToast(data.mensaje || 'Error al registrar.', 'info');
            btn.disabled = false;
            btn.textContent = textoOriginal;
            return;
          }

          mostrarToast('¡Registro exitoso! Bienvenido a WhiteArt.', 'success');
          setTimeout(() => {
            window.location.href = 'Dashboard.html';
          }, 1000);
        } catch (err) {
          mostrarToast('Error de conexión con el servidor.', 'info');
          btn.disabled = false;
          btn.textContent = textoOriginal;
        }
      });

      document.getElementById('btnGoogleRegistro').addEventListener('click', function() {
        mostrarToast('Registro con cuenta de Google exitoso.', 'success');
        setTimeout(() => {
          window.location.href = 'Dashboard.html';
        }, 1200);
      });
    </script>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
